$('#app').innerHTML=`<div style="max-width:380px;margin:12vh auto;padding:0 16px"><div class="card"><h1>Studio Balance</h1><p class="mut">${code?'שלחנו קוד חד-פעמי אל '+esc(LE):'כניסה עם קוד חד-פעמי באימייל'}</p>${code?`<input id="cd" inputmode="numeric" autocomplete="one-time-code" placeholder="הקוד מהאימייל" onkeydown="if(event.key==='Enter')verifyCode()"><button class="btn pri full" onclick="verifyCode()">כניסה</button><button class="btn full" onclick="loginUI()">שינוי אימייל</button>`:`<input id="em" type="email" autocomplete="email" placeholder="אימייל" onkeydown="if(event.key==='Enter')sendCode()"><button class="btn pri full" onclick="sendCode()">שליחת קוד</button>`}<div class="mut bad" style="margin-top:8px">${esc(msg||'')}</div></div></div>`}

  const[{data:mem},{data:inv}]=await Promise.all([sb.from('memberships').select('user_id,email,role').eq('org_id',ME.org),sb.from('invites').select('id,email,role').eq('org_id',ME.org)]);

// Adapter: exposes the small API the UI uses on top of Supabase tables.
function mkDb(sb,org){
  const today=()=>new Date().toISOString().slice(0,10);
  const toRow=(id,o)=>({id,org_id:org,name:o.name,phone:o.phone,source:o.src||null,received_on:o.date||today(),stage:o.stage||'new',reached:o.reached||0,note:o.note||'',lost_reason:o.reason||null,trial_date:o.tDate||null,trial_time:o.tTime||null,custom:o.cf||{},last_activity:o.upd||null});
  const fromRow=r=>({name:r.name,phone:r.phone,src:r.source||'',date:r.received_on,stage:r.stage,reached:r.reached,note:r.note||'',reason:r.lost_reason||undefined,tDate:r.trial_date||'',tTime:(r.trial_time||'').slice(0,5),cf:r.custom||{},upd:r.last_activity||r.received_on});
  let pend=new Map(),ws=[],tm,reloadL=()=>{};
  const flush=async()=>{const rows=[...pend.values()],w=ws;pend=new Map();ws=[];
    const{error}=await sb.from('leads').upsert(rows);
    if(error){alert('שגיאת שמירה: '+error.message);reloadL()}
    w.forEach(([ok,no])=>error?no(error):ok())};
  const watch=(table,fn)=>{let t;sb.channel(table+org).on('postgres_changes',{event:'*',schema:'public',table,filter:'org_id=eq.'+org},()=>{clearTimeout(t);t=setTimeout(fn,300)}).subscribe()};
  return{
    importRows:async list=>{if(!list.length)return 0;let n=0;
      const rows=list.map(x=>toRow(x.id,x));
      for(let i=0;i<rows.length;i+=500){
        const{data,error}=await sb.from('leads').upsert(rows.slice(i,i+500),{onConflict:'org_id,phone_key',ignoreDuplicates:true}).select('id');
        if(error){alert('שגיאת ייבוא: '+error.message);break}n+=data.length}
      reloadL();return n},
    collection:()=>({
      doc:id=>({
        set:o=>new Promise((ok,no)=>{pend.set(id,toRow(id,o));ws.push([ok,no]);clearTimeout(tm);tm=setTimeout(flush,60)}),
        delete:async()=>{const{error}=await sb.from('leads').delete().eq('id',id);if(error)throw error}
      }),
      onSnapshot:(next,err)=>{
        const load=async()=>{let all=[],from=0;
          for(;;){const{data,error}=await sb.from('leads').select('*').eq('org_id',org).order('received_on',{ascending:false}).order('id').range(from,from+999);
            if(error)return err&&err(error);all=all.concat(data);if(data.length<1000)break;from+=1000}
          next({docs:all.map(r=>({id:r.id,data:()=>fromRow(r)}))})};
        reloadL=load;load();watch('leads',load);return()=>{}}
    }),
    doc:()=>({
      set:async({list})=>{
        const rows=list.map((f,i)=>({id:f.id,org_id:org,name:f.name,type:f.type,options:f.opts||[],position:i}));
        if(rows.length){const{error}=await sb.from('lead_fields').upsert(rows);if(error)throw error}
        let q=sb.from('lead_fields').delete().eq('org_id',org);
        if(rows.length)q=q.not('id','in','('+rows.map(r=>r.id).join(',')+')');
        const{error:e2}=await q;if(e2)throw e2},
      onSnapshot:(next,err)=>{
        const load=async()=>{const{data,error}=await sb.from('lead_fields').select('*').eq('org_id',org).order('position');
          if(error)return err&&err(error);
          next({exists:true,data:()=>({list:data.map(r=>({id:r.id,name:r.name,type:r.type,opts:r.options||[]}))})})};
        load();watch('lead_fields',load);return()=>{}}
    })
  };
}
async function exportCSV(){

  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=L.map(l=>[l.name,l.date,l.phone,SN[l.stage],l.src,l.note,l.reason||'',l.reached||0,...F.map(f=>(l.cf||{})[f.id]??'')]);
  const csv='\uFEFF'+[hdr,...rows].map(r=>r.map(q).join(',')).join('\r\n'),fn='leads-'+iso()+'.csv';

  }else{mode='local';try{L=JSON.parse(localStorage.getItem(LS))||[]}catch(e){L=[]}try{F=JSON.parse(localStorage.getItem('sb_fields'))||[]}catch(e){F=[]}draw()}
}

function draw(){

  const tn=tasks().reduce((a,g)=>a+g.arr.length,0),adm=sb&&ME&&ME.role!=='member';

  const side=`<aside class="side"><div class="brand">Studio Balance</div>${nv('tasks','✅','משימות',tn)}${nv('fall','📊','מפל')}${nv('leads','👥','לידים')}<button class="nv" onclick="fieldsM()"><span>⚙</span>שדות</button><button class="nv" onclick="impM()"><span>⬆</span>ייבוא</button><button class="nv" onclick="exportCSV()"><span>⬇</span>ייצוא</button>${adm?nv('users','👤','משתמשים')+nv('audit','🕘','יומן'):''}${sb?'<button class="nv" onclick="logout()"><span>⎋</span>יציאה</button>':''}<div class="mut st">${mode==='db'?'✓ נשמר במסד נתונים':mode==='local'?'נשמר רק במכשיר הזה':mode==='err'?'שגיאת חיבור':'מתחבר…'}</div></aside>`;
  let main;
  if(page==='tasks')main=tasksHtml();
  else if(page==='fall'){
    const lost=L.filter(l=>l.stage==='lost'),fu=L.filter(l=>l.stage==='followup'),dead=L.filter(l=>l.stage==='dead'),rs={};lost.forEach(l=>{const r=l.reason||'לא צוין';rs[r]=(rs[r]||0)+1});
    main=`<h1>מפל לקוחות</h1><p class="mut">לחיצה על שלב פותחת את הלידים שנמצאים בו עכשיו.</p><div class="card">`+IDX.map((k,i)=>{const c=reach(i),p=i?reach(i-1):c;
      return `<div class="fun ${k==='closed'?'won':''}" style="cursor:pointer" onclick="filt='${k}';go('leads')"><div class="t"><span>${SN[k]}</span><b>${c}</b></div><div class="b" style="width:${c/mx*100}%"></div><div class="d">${i?(p?Math.round(c/p*100):0)+'% מהשלב הקודם':'כל הפניות'}</div></div>`}).join('')+
      `<div class="dz">${['hot','warm','cold'].map(k=>`<div onclick="filt='h:${k}';go('leads')">${HI[k]} ${HN[k]}<br><b>${L.filter(l=>hk(l)===k).length}</b></div>`).join('')}</div>`+
      `<div class="dz">${[['lost',lost.length],['followup',fu.length],['dead',dead.length]].map(([k,c])=>`<div class="${k==='lost'?'lost':''}" onclick="filt='${k}';go('leads')">${SN[k]}<br><b>${c}</b></div>`).join('')}</div>`+
      (lost.length?`<div class="mut bad" style="margin-top:10px">סיבות כשלון: ${Object.entries(rs).sort((a,b)=>b[1]-a[1]).map(([k,v])=>esc(k)+' ('+v+')').join(' · ')}</div>`:'')+`</div>`;
  }else if(page==='users')main='<h1>משתמשים</h1><div id="usr" class="empty">טוען…</div>';
  else if(page==='audit')main='<h1>יומן פעילות</h1><div class="row" style="flex-wrap:wrap;margin-bottom:10px"><select id="auu" onchange="auRows()" style="margin:0;flex:1"></select><input id="aus" placeholder="חיפוש" oninput="auRows()" style="margin:0;flex:2"></div><div class="tw card"><table><thead><tr><th>זמן</th><th>משתמש</th><th>פעולה</th><th>ליד</th><th>פרטים</th></tr></thead><tbody id="aur"><tr><td colspan="5" class="empty">טוען…</td></tr></tbody></table></div>';
  else{
    main=`<div class="row" style="margin-bottom:10px;flex-wrap:wrap"><input id="q" placeholder="חיפוש שם או טלפון (Enter לחיפוש מיידי)" value="${esc(qraw)}" oninput="qd(this.value)" onkeydown="if(event.key==='Enter')qd(this.value,1)" style="margin:0;flex:1;min-width:200px"><div class="chips" style="margin:0">${[['list','כרטיסים'],['board','עמודות'],['table','טבלה']].map(v=>`<button class="chip ${view===v[0]?'on':''}" onclick="setV('${v[0]}')">${v[1]}</button>`).join('')}</div><button class="btn pri" onclick="addM()">+ ליד חדש</button></div>`+
    (view==='board'?'':`<div class="chips">${[['all','הכול ('+nAll+')'],...['hot','warm','cold'].map(k=>['h:'+k,HI[k]+' '+HN[k]+' ('+L.filter(l=>hk(l)===k).length+')']),...ST.map(x=>[x[0],x[1]+' ('+L.filter(l=>l.stage===x[0]).length+')'])].map(x=>`<button class="chip ${filt===x[0]?'on':''} ${x[0]==='lost'?'negchip':''}" data-s="${x[0]==='all'||x[0].includes(':')?'':x[0]}" onclick="filt='${x[0]}';draw()">${x[1]}</button>`).join('')}</div>`)+
    `<div id="list" class="${view==='list'?'cards':''}"></div>`}
  const f=ae&&ae.id==='q';
  $('#app').innerHTML=`<div class="shell">${side}<main class="main">${main}</main></div>`;
  if(page==='leads')list();if(page==='users')loadUsers();if(page==='audit')loadAudit();
  const nw=document.querySelector('.tw,.cards,.cols');if(nw&&sp){nw.scrollTop=sp[0];nw.scrollLeft=sp[1]}
  if(f){const e=$('#q');if(e){e.focus();e.setSelectionRange(qraw.length,qraw.length)}}
}
init();draw();
</script>
</body></html>
